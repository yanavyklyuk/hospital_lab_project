{% extends "frontend/object_form.html" %}

{% block title %}Delete Favor{% endblock %}

{% block header %}Are you sure you want to delete this favor?{% endblock %}

{% block content %}
<form method="post" action="{% url 'favor_delete' id=favor.id %}">
    {% csrf_token %}

    <p>Name: {{ favor.name }} </p>

    <button type="submit" onclick="return confirm('Are you sure you want to delete this favor?');">Delete</button>
    <a href="{% url 'favor_list' %}">Cancel</a>
</form>
{% endblock %}
