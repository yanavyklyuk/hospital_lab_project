<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital | {% block title %}Object{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #83a4d4, #b6fbff);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header, footer {
            background-color: #1d3557;
            color: white;
            padding: 1em;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.5em;
            padding: 1em;
            background: linear-gradient(135deg, #457b9d, #2a5d82);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }

        .nav-tile {
            background-color: #1d3557;
            color: white;
            padding: 20px;
            border-radius: 8px;
            width: 120px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s, background-color 0.3s;
        }

        .nav-tile:hover {
            background-color: #a8dadc;
            color: #1d3557;
            transform: translateY(-5px);
        }

        main {
            flex: 1;
            padding: 2em;
        }

        h1 {
            margin: 0;
            font-size: 2em;
        }

        footer p {
            margin: 0;
        }

        a {
            color: #333;
            text-decoration: none;
            font-weight: normal;
        }

        a:hover {
            color: #386988;
        }

        nav a {
            color: white;
        }

        nav a:hover {
            color: #a3e2ff;
        }

        .dropdown {
        position: relative;
        display: inline-block;
        }

        .dropdown button {
            background-color: #457b9d;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .dropdown button:hover {
            background-color: #2a5d82;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f1f1f1;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 5px;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #386988;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="{% url 'doctor_list' %}">Doctors</a>
        <a href="{% url 'patient_list' %}">Patients</a>
        <a href="{% url 'appointment_list' %}">Appointments</a>
        <a href="{% url 'schedule_list' %}">Schedules</a>
        <a href="{% url 'favor_list' %}">Favors</a>
        <a href="{% url 'disease_history_list' %}">Disease Histories</a>
        <div class="dropdown">
        <button>Statistics</button>
        <div class="dropdown-content">
            <a href="{% url 'dashboard' %}">Plotly</a>
            <a href="{% url 'bokeh_dashboard' %}">Bokeh</a>
        </div>
        </div>
    </nav>
    <h1>{% block header %}Header{% endblock %}</h1>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer>
    <p>© 2024 Sigma Hospital</p>
</footer>
</body>
</html>
