<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital | {% block title %}Object{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #83a4d4, #b6fbff);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header, footer {
            background-color: #1d3557;
            color: white;
            padding: 1em;
            text-align: center;
        }

        main {
            flex: 1;
            padding: 2em;
        }

        h1 {
            margin: 0;
            font-size: 2em;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
<header>
    <h1>{% block header %}Header{% endblock %}</h1>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer>
    <p>© 2024 Sigma Hospital</p>
</footer>
</body>
</html>
