{% extends "frontend/object_form.html" %}

{% block title %}Delete Patient{% endblock %}

{% block header %}Are you sure you want to delete this patient?{% endblock %}

{% block content %}
    <form method="post" action="{% url 'patient_delete' id=patient.id %}">
        {% csrf_token %}

        <p>Patient: {{ patient.first_name }} {{ patient.last_name }}</p>
        
        <button type="submit" onclick="return confirm('Are you sure you want to delete this patient?');">Delete</button>
        <a href="{% url 'patient_list' %}">Cancel</a>
    </form>
{% endblock %}
