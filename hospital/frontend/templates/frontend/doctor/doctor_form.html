{% extends "frontend/object_form.html" %}

{% block title %}Doctor Form{% endblock %}

{% block header %}Fill Doctor Form{% endblock %}

{% block additional_fields %}
    <div class="form-group">
        <label for="specialisation_id">Specialisation</label>
        <select name="specialisation_id" required>
            {% for specialisation in specialisations %}
                <option value="{{ specialisation.id }}" {% if doctor.specialisation_id == specialisation.id %}selected{% endif %}>
                    {{ specialisation.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="sex">Sex</label>
        <select name="sex" required>
            <option value="male" {% if doctor.sex == 'male' %}selected{% endif %}>Male</option>
            <option value="female" {% if doctor.sex == 'female' %}selected{% endif %}>Female</option>
        </select>
    </div>
{% endblock %}
